services:
  neo4j-v2-finegrain:
    image: neo4j:5.26-community
    container_name: neo4j-kg-v2-finegrain
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/knowledgegraphv2
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_default__advertised__address: 192.168.10.61
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
    volumes:
      - neo4j_kg_v2_finegrain_data:/data
      - neo4j_kg_v2_finegrain_logs:/logs
      - ./import:/var/lib/neo4j/import
      - ./cypher:/cypher

volumes:
  neo4j_kg_v2_finegrain_data:
  neo4j_kg_v2_finegrain_logs:
